<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NetMovie — Admin Panel</title>
<meta name="robots" content="noindex, nofollow"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--panel:#141419;--panel2:#1c1c24;--border:#2a2a33;--red:#e8163a;--red2:#b8102e;--text:#eef0f4;--dim:#9a9aa8;--muted:#5a5a66;--green:#10b981;--r:12px}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.5}
input,textarea,select,button{font-family:inherit;font-size:13px}
a{color:var(--red)}
.topbar{position:sticky;top:0;z-index:30;background:rgba(10,10,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:16px;font-weight:800}
.topbar .sp{flex:1}
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{border-color:#3a3a44}
.btn.primary{background:linear-gradient(135deg,var(--red),var(--red2));border:none;color:#fff}
.btn.green{background:linear-gradient(135deg,var(--green),#059669);border:none;color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.danger{color:#ff6b6b;border-color:#3a2226}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:920px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:8px 15px;border-radius:9px;background:var(--panel);border:1px solid var(--border);color:var(--dim);cursor:pointer;font-weight:600;transition:.2s}
.tab.active{background:var(--red);color:#fff;border-color:var(--red)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input[type=text],.field textarea,.field select{width:100%;padding:9px 11px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);color:var(--text);transition:.2s}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--red)}
.field textarea{resize:vertical;min-height:60px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.color-field{display:flex;align-items:center;gap:8px}
.color-field input[type=color]{width:38px;height:34px;border:1px solid var(--border);border-radius:7px;background:var(--panel2);cursor:pointer;padding:2px}
.color-field input[type=text]{flex:1}
.item{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;position:relative}
.item-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.item-head .title{font-weight:700;font-size:13px;flex:1}
.chip{font-size:10px;padding:2px 8px;border-radius:5px;background:#2a2a33;color:var(--dim)}
.subtle{color:var(--muted);font-size:12px}
.feat-row{display:flex;gap:6px;margin-bottom:6px}
.feat-row input{flex:1}
.sw{position:relative;width:38px;height:22px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw .sl{position:absolute;inset:0;background:#3a3a44;border-radius:22px;transition:.2s;cursor:pointer}
.sw .sl::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+.sl{background:var(--green)}
.sw input:checked+.sl::before{transform:translateX(16px)}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
#gate .box{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px}
#gate h2{font-size:20px;margin-bottom:6px}
#gate p{color:var(--dim);font-size:13px;margin-bottom:18px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel2);border:1px solid var(--border);padding:12px 20px;border-radius:10px;z-index:60;transition:.3s;opacity:0;font-weight:600;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%);opacity:1}
#toast.ok{border-color:var(--green)}
#toast.err{border-color:var(--red)}
.hint{background:#1a1420;border:1px solid #2a2030;border-radius:9px;padding:10px 12px;font-size:12px;color:var(--dim);margin-bottom:14px}
.reorder{display:flex;gap:3px}
.reorder button{width:26px;height:26px;padding:0;display:grid;place-items:center}
.logo-prev{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-weight:900;color:#fff;overflow:hidden;flex-shrink:0;background:#222}
.logo-prev img{width:100%;height:100%;object-fit:cover}
.logo-box{display:flex;gap:12px;align-items:flex-start;background:#15151b;border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:12px}
.logo-ctrl{flex:1}
.block-type{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:5px;background:var(--red);color:#fff;text-transform:uppercase;letter-spacing:.5px}
.add-block{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.add-block button{font-size:11px;padding:6px 11px}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>🔐 Admin Access</h2>
    <p>Enter your GitHub details. Token stays in this browser only.</p>
    <div class="field"><label>GitHub Username / Org</label><input type="text" id="g_owner" placeholder=""></div>
    <div class="field"><label>Repository</label><input type="text" id="g_repo" placeholder=""></div>
    <div class="field"><label>Branch</label><input type="text" id="g_branch" value=""></div>
    <div class="field"><label>Config file path</label><input type="text" id="g_path" value=""></div>
    <div class="field"><label>Personal Access Token (repo scope)</label><input type="text" id="g_token" placeholder="ghp_..."></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin:10px 0 16px"><input type="checkbox" id="g_remember"> Remember on this device</label>
    <button class="btn primary" style="width:100%" onclick="connect()">Connect & Load</button>
    <div id="gate_err" style="color:#ff6b6b;font-size:12px;margin-top:10px"></div>
  </div>
</div>

<div class="topbar" style="display:none" id="topbar">
  <h1>NetMovie Admin</h1>
  <span class="chip" id="shaChip">loaded</span>
  <span class="chip" id="mntChip" style="display:none;background:#3a2226;color:#ff6b6b">⚠ MAINTENANCE ON</span>
  <div class="sp"></div>
  <button class="btn sm" onclick="previewJson()">View JSON</button>
  <button class="btn sm danger" onclick="lock()">Lock</button>
  <button class="btn green" id="saveBtn" onclick="save()">💾 Save & Publish</button>
</div>

<div class="wrap" id="main" style="display:none">
  <div class="tabs" id="tabs"></div>
  <div id="editor"></div>
</div>

<input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/svg+xml" style="display:none">
<div id="toast"></div>

<script>
let GH={owner:'',repo:'',branch:'main',path:'site-config.json',token:''};
let CFG=null, SHA=null, TAB='hero', uploadCb=null;
const $=id=>document.getElementById(id);
const uid=()=>'x'+Math.random().toString(36).slice(2,8);
function toast(m,k){const t=$('toast');t.textContent=m;t.className='show '+(k||'');setTimeout(()=>t.className='',2800);}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function attr(s){return String(s==null?'':s).replace(/"/g,'&quot;');}

/* ---------- CONNECT ---------- */
function connect(){
  GH.owner=$('g_owner').value.trim();GH.repo=$('g_repo').value.trim();
  GH.branch=$('g_branch').value.trim()||'main';GH.path=$('g_path').value.trim()||'site-config.json';
  GH.token=$('g_token').value.trim();
  if(!GH.owner||!GH.repo||!GH.token){$('gate_err').textContent='Fill owner, repo and token.';return;}
  if($('g_remember').checked) localStorage.setItem('nm_admin',JSON.stringify(GH));
  loadConfig();
}
function lock(){localStorage.removeItem('nm_admin');location.reload();}
async function loadConfig(){
  $('gate_err').textContent='Loading…';
  try{
    const url=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${encodeURIComponent(GH.path)}?ref=${GH.branch}&t=${Date.now()}`;
    const r=await fetch(url,{headers:{Authorization:'token '+GH.token,Accept:'application/vnd.github+json'}});
    if(r.status===404){CFG=defaultConfig();SHA=null;enterApp();toast('New config (created on save)','ok');return;}
    if(!r.ok) throw new Error('GitHub '+r.status);
    const d=await r.json();SHA=d.sha;
    CFG=JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,'')))));
    enterApp();
  }catch(e){$('gate_err').textContent='Failed: '+e.message;}
}
function enterApp(){
  $('gate').style.display='none';$('topbar').style.display='flex';$('main').style.display='block';
  $('shaChip').textContent=SHA?'synced':'new file';
  buildTabs();renderTab();refreshMntChip();
}
function refreshMntChip(){$('mntChip').style.display=(CFG.maintenance&&CFG.maintenance.enabled)?'inline-block':'none';}

/* ---------- SAVE CONFIG ---------- */
async function save(){
  $('saveBtn').disabled=true;$('saveBtn').textContent='Saving…';
  try{
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(CFG,null,2))));
    const body={message:'admin update '+new Date().toISOString(),content,branch:GH.branch};
    if(SHA) body.sha=SHA;
    const url=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${encodeURIComponent(GH.path)}`;
    const r=await fetch(url,{method:'PUT',headers:{Authorization:'token '+GH.token,Accept:'application/vnd.github+json'},body:JSON.stringify(body)});
    if(!r.ok){const t=await r.text();throw new Error('GitHub '+r.status+' '+t.slice(0,120));}
    const d=await r.json();SHA=d.content.sha;$('shaChip').textContent='synced';
    toast('Saved & published ✓','ok');
  }catch(e){toast('Save failed: '+e.message,'err');}
  $('saveBtn').disabled=false;$('saveBtn').textContent='💾 Save & Publish';
}
function previewJson(){const w=window.open('','_blank');w.document.write('<pre style="white-space:pre-wrap;word-break:break-word;font:12px monospace;background:#0a0a0f;color:#eee;padding:20px">'+JSON.stringify(CFG,null,2).replace(/</g,'&lt;')+'</pre>');}

/* ---------- IMAGE UPLOAD TO GITHUB ---------- */
$('fileInput').addEventListener('change',async function(){
  const file=this.files[0];this.value='';if(!file||!uploadCb)return;
  if(file.size>1.5*1024*1024){toast('Image too big (max 1.5MB)','err');return;}
  toast('Uploading image…');
  try{
    const b64=await fileToB64(file);
    const ext=(file.name.split('.').pop()||'png').toLowerCase();
    const path=`assets/logos/${uid()}.${ext}`;
    const url=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`;
    const r=await fetch(url,{method:'PUT',headers:{Authorization:'token '+GH.token,Accept:'application/vnd.github+json'},
      body:JSON.stringify({message:'upload logo '+path,content:b64,branch:GH.branch})});
    if(!r.ok){const t=await r.text();throw new Error('GitHub '+r.status+' '+t.slice(0,100));}
const siteUrl = `https://www.netmovie.site/${path}`;
uploadCb(siteUrl);uploadCb=null;toast('Image uploaded ✓','ok');touch();
  }catch(e){toast('Upload failed: '+e.message,'err');uploadCb=null;}
});
function fileToB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});}
function pickImage(cb){uploadCb=cb;$('fileInput').click();}

/* ---------- TABS ---------- */
function buildTabs(){
  const base=[['hero','Hero'],['tiles','Landing Tiles'],['groups','Tile Groups'],['sections','Sections'],['maintenance','🔧 Maintenance'],['footer','Footer'],['meta','Meta / SEO'],['remote','Remote Fetch']];
  $('tabs').innerHTML=base.map(([id,lb])=>`<div class="tab ${TAB===id?'active':''}" onclick="setTab('${id}')">${lb}</div>`).join('');
}
function setTab(id){TAB=id;buildTabs();renderTab();}
function renderTab(){
  const e=$('editor');
  if(TAB==='hero')e.innerHTML=renderHero();
  else if(TAB==='tiles')e.innerHTML=renderTiles();
  else if(TAB==='groups')e.innerHTML=renderGroups();
  else if(TAB==='sections')e.innerHTML=renderSections();
  else if(TAB==='maintenance')e.innerHTML=renderMaintenance();
  else if(TAB==='footer')e.innerHTML=renderFooter();
  else if(TAB==='meta')e.innerHTML=renderMeta();
  else if(TAB==='remote')e.innerHTML=renderRemote();
  refreshMntChip();
}
function touch(){renderTab();}

/* ---------- FIELD HELPERS ---------- */
function txt(l,v,oi,ph){return `<div class="field"><label>${l}</label><input type="text" value="${attr(v)}" oninput="${oi}" placeholder="${ph||''}"></div>`;}
function area(l,v,oi){return `<div class="field"><label>${l}</label><textarea oninput="${oi}">${esc(v)}</textarea></div>`;}
function color(l,v,oi){const x=v||'#000000';return `<div class="field"><label>${l}</label><div class="color-field"><input type="color" value="${attr(x)}" oninput="${oi}"><input type="text" value="${attr(x)}" oninput="${oi}"></div></div>`;}
function sel(l,v,opts,oi){return `<div class="field"><label>${l}</label><select onchange="${oi}">${opts.map(o=>`<option value="${o}" ${o===v?'selected':''}>${o}</option>`).join('')}</select></div>`;}
function switchEl(c,oc){return `<label class="sw"><input type="checkbox" ${c!==false?'checked':''} onchange="${oc}"><span class="sl"></span></label>`;}
function move(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return;const t=arr[i];arr[i]=arr[j];arr[j]=t;touch();}

/* ---------- LOGO EDITOR (reusable: text badge OR image) ---------- */
function logoEditor(logoObj, pathExpr){
  // logoObj: {type:'text'|'image', text, colors:[c1,c2], url}
  const lg=logoObj;
  const prev = lg.type==='image' && lg.url
    ? `<div class="logo-prev"><img src="${attr(lg.url)}"></div>`
    : `<div class="logo-prev" style="background:linear-gradient(135deg,${esc((lg.colors||['#333','#111'])[0])},${esc((lg.colors||['#333','#111'])[1]||'#111')})">${esc(lg.text||'')}</div>`;
  let ctrl='';
  if(lg.type==='image'){
    ctrl=`${txt('Image URL',lg.url,`${pathExpr}.url=this.value`,'https://...png')}
      <button class="btn sm" onclick="pickImage(u=>{${pathExpr}.url=u})">⬆ Upload PNG/JPG</button>`;
  }else{
    ctrl=`<div class="row">${txt('Letter(s)',lg.text,`${pathExpr}.text=this.value`)}
      ${color('Color 1',(lg.colors||[])[0],`${pathExpr}.colors=${pathExpr}.colors||['#333','#111'];${pathExpr}.colors[0]=this.value`)}</div>
      ${color('Color 2',(lg.colors||[])[1],`${pathExpr}.colors=${pathExpr}.colors||['#333','#111'];${pathExpr}.colors[1]=this.value`)}`;
  }
  return `<div class="logo-box">${prev}<div class="logo-ctrl">
    ${sel('Logo type',lg.type||'text',['text','image'],`${pathExpr}.type=this.value;touch()`)}
    ${ctrl}
  </div></div>`;
}
function ensureLogo(obj){ if(!obj.logo){ obj.logo={type:'text',text:obj.logo_text||'',colors:obj.logo_colors||['#333','#111']}; } return obj.logo; }

/* ---------- HERO ---------- */
function renderHero(){
  const h=CFG.hero=CFG.hero||{};
  ensureLogo(h.brand_logo?{logo:h.brand_logo}:{}); // noop safety
  h.brand_logo=h.brand_logo||{type:'text',text:h.brand_logo_text||'N',colors:[h.brand_color||'#e8163a','#b8102e']};
  const langs=(h.languages||[]).map((l,i)=>`<div class="feat-row"><input type="text" value="${attr(l)}" oninput="CFG.hero.languages[${i}]=this.value"><button class="btn sm danger" onclick="CFG.hero.languages.splice(${i},1);touch()">✕</button></div>`).join('');
  const feats=(h.features||[]).map((f,i)=>`<div class="item"><div class="row3">${txt('Icon',f.icon,`CFG.hero.features[${i}].icon=this.value`)}${txt('Label',f.label,`CFG.hero.features[${i}].label=this.value`)}${color('BG tint',f.bg,`CFG.hero.features[${i}].bg=this.value`)}</div><button class="btn sm danger" onclick="CFG.hero.features.splice(${i},1);touch()">Remove</button></div>`).join('');
  return `
  <div class="card"><h3>Brand</h3>
    ${logoEditor(h.brand_logo,'CFG.hero.brand_logo')}
    <div class="row">${txt('Brand name',h.brand_name,`CFG.hero.brand_name=this.value`)}${txt('Accent word',h.brand_accent,`CFG.hero.brand_accent=this.value`)}</div>
    ${color('Brand color (accent text)',h.brand_color,`CFG.hero.brand_color=this.value`)}
  </div>
  <div class="card"><h3>Headline</h3>
    ${txt('Title line 1',h.title_line1,`CFG.hero.title_line1=this.value`)}
    ${txt('Title line 2 (gradient)',h.title_line2,`CFG.hero.title_line2=this.value`)}
    ${area('Subtitle',h.subtitle,`CFG.hero.subtitle=this.value`)}
  </div>
  <div class="card"><h3>Languages<span class="sp"></span><button class="btn sm" onclick="CFG.hero.languages=CFG.hero.languages||[];CFG.hero.languages.push('New');touch()">+ Add</button></h3>${langs||'<div class="subtle">None</div>'}</div>
  <div class="card"><h3>Feature pills<span class="sp"></span><button class="btn sm" onclick="CFG.hero.features=CFG.hero.features||[];CFG.hero.features.push({icon:'⭐',label:'New',bg:'rgba(255,255,255,.1)'});touch()">+ Add</button></h3>${feats||'<div class="subtle">None</div>'}</div>`;
}

/* ---------- TILE EDITOR (with image icon option) ---------- */
function tileEditor(t,p){
  t.icon_img=t.icon_img||'';
  return `
    <div class="row">${sel('Icon type',t.icon_type||'emoji',['emoji','image'],`${p}.icon_type=this.value;touch()`)}
    ${t.icon_type==='image'?txt('Icon image URL',t.icon_img,`${p}.icon_img=this.value`):txt('Icon (emoji)',t.icon,`${p}.icon=this.value`)}</div>
    ${t.icon_type==='image'?`<button class="btn sm" style="margin-bottom:10px" onclick="pickImage(u=>{${p}.icon_img=u})">⬆ Upload icon</button>`:''}
    ${txt('Title',t.title,`${p}.title=this.value`)}
    ${txt('Subtitle',t.subtitle,`${p}.subtitle=this.value`)}
    <div class="row">${color('Color',t.color,`${p}.color=this.value`)}${color('Gradient end',t.gradient_end,`${p}.gradient_end=this.value`)}</div>
    <div class="row">${txt('Badge text',t.badge_text,`${p}.badge_text=this.value`)}${color('Badge color',t.badge_color,`${p}.badge_color=this.value`)}</div>
    ${txt('CTA text',t.cta_text,`${p}.cta_text=this.value`)}
    <div class="row">${sel('Action',t.action_type||'section',['section','link'],`${p}.action_type=this.value;touch()`)}${txt(t.action_type==='link'?'Link URL':'Target section id',t.action_target,`${p}.action_target=this.value`)}</div>`;
}

/* ---------- LANDING TILES ---------- */
function renderTiles(){
  CFG.landing_tiles=CFG.landing_tiles||[];
  const items=CFG.landing_tiles.map((t,i)=>`<div class="item"><div class="item-head"><span class="title">${esc(t.title||'Untitled')}</span><div class="reorder"><button class="btn sm" onclick="move(CFG.landing_tiles,${i},-1)">▲</button><button class="btn sm" onclick="move(CFG.landing_tiles,${i},1)">▼</button></div>${switchEl(t.enabled,`CFG.landing_tiles[${i}].enabled=this.checked`)}</div>${tileEditor(t,`CFG.landing_tiles[${i}]`)}<button class="btn sm danger" onclick="CFG.landing_tiles.splice(${i},1);touch()">Delete tile</button></div>`).join('');
  return `<div class="hint">Big category cards on the homepage. "section" jumps to a section id; "link" opens a URL.</div><div class="card"><h3>Landing Tiles<span class="sp"></span><button class="btn sm" onclick="CFG.landing_tiles.push(newTile());touch()">+ Add tile</button></h3>${items||'<div class="subtle">No tiles</div>'}</div>`;
}

/* ---------- GROUPS ---------- */
function renderGroups(){
  CFG.landing_groups=CFG.landing_groups||[];
  const items=CFG.landing_groups.map((g,gi)=>{
    g.tiles=g.tiles||[];
    const tiles=g.tiles.map((t,ti)=>`<div class="item"><div class="item-head"><span class="title">${esc(t.title||'Tile')}</span><div class="reorder"><button class="btn sm" onclick="move(CFG.landing_groups[${gi}].tiles,${ti},-1)">▲</button><button class="btn sm" onclick="move(CFG.landing_groups[${gi}].tiles,${ti},1)">▼</button></div>${switchEl(t.enabled,`CFG.landing_groups[${gi}].tiles[${ti}].enabled=this.checked`)}</div>${tileEditor(t,`CFG.landing_groups[${gi}].tiles[${ti}]`)}<button class="btn sm danger" onclick="CFG.landing_groups[${gi}].tiles.splice(${ti},1);touch()">Delete</button></div>`).join('');
    return `<div class="card"><h3>${esc(g.title||'Group')}<span class="sp"></span>${switchEl(g.enabled,`CFG.landing_groups[${gi}].enabled=this.checked`)}<button class="btn sm danger" onclick="CFG.landing_groups.splice(${gi},1);touch()">Delete group</button></h3>${txt('Group title',g.title,`CFG.landing_groups[${gi}].title=this.value`)}${txt('Group subtitle',g.subtitle,`CFG.landing_groups[${gi}].subtitle=this.value`)}${txt('Columns',g.columns||2,`CFG.landing_groups[${gi}].columns=parseInt(this.value)||2`)}<div style="margin:10px 0 4px;font-weight:700;font-size:12px">Tiles <button class="btn sm" style="margin-left:8px" onclick="CFG.landing_groups[${gi}].tiles.push(newTile());touch()">+ Add tile</button></div>${tiles||'<div class="subtle">No tiles</div>'}</div>`;
  }).join('');
  return `<div class="hint">Titled rows of tiles (e.g. "Live TV & Sports").</div>${items||''}<button class="btn" onclick="CFG.landing_groups.push({id:uid(),title:'New Group',subtitle:'',columns:2,enabled:true,tiles:[]});touch()">+ Add group</button>`;
}

/* ---------- SECTIONS with BLOCKS ---------- */
function renderSections(){
  CFG.sections=CFG.sections||[];
  const items=CFG.sections.map((s,si)=>{
    migrateSection(s);
    const blocks=s.blocks.map((b,bi)=>blockEditor(b,si,bi)).join('');
    return `<div class="card"><h3>📄 ${esc(s.title||'Section')}<span class="sp"></span><div class="reorder"><button class="btn sm" onclick="move(CFG.sections,${si},-1)">▲</button><button class="btn sm" onclick="move(CFG.sections,${si},1)">▼</button></div>${switchEl(s.enabled,`CFG.sections[${si}].enabled=this.checked`)}<button class="btn sm danger" onclick="if(confirm('Delete whole section?')){CFG.sections.splice(${si},1);touch()}">Delete</button></h3>
      <div class="row">${txt('Section id',s.id,`CFG.sections[${si}].id=this.value`)}${txt('Title',s.title,`CFG.sections[${si}].title=this.value`)}</div>
      ${txt('Subtitle',s.subtitle,`CFG.sections[${si}].subtitle=this.value`)}
      <div style="margin:14px 0 6px;font-weight:700;font-size:12px">Blocks (any order)</div>
      ${blocks||'<div class="subtle">No blocks yet — add one below.</div>'}
      <div class="add-block">
        <button class="btn sm" onclick="addBlock(${si},'apps')">+ Apps box</button>
        <button class="btn sm" onclick="addBlock(${si},'webs')">+ Webs box</button>
        <button class="btn sm" onclick="addBlock(${si},'tiles')">+ Tiles</button>
        <button class="btn sm" onclick="addBlock(${si},'text')">+ Text</button>
        <button class="btn sm" onclick="addBlock(${si},'button')">+ Button</button>
        <button class="btn sm" onclick="addBlock(${si},'divider')">+ Divider</button>
      </div>
    </div>`;
  }).join('');
  return `<div class="hint">Sections are detail pages. Each holds <b>blocks</b> you can stack in any order: app boxes, web boxes, tiles, text, buttons, dividers. Build anything.</div>${items||''}<button class="btn primary" onclick="CFG.sections.push(newSection());touch()">+ Add new section</button>`;
}

function migrateSection(s){
  if(Array.isArray(s.blocks)) return;
  // convert old apps/web_links into blocks
  s.blocks=[];
  if((s.apps||[]).length) s.blocks.push({id:uid(),type:'apps',enabled:true,apps:s.apps});
  if((s.web_links||[]).length){ s.blocks.push({id:uid(),type:'divider',enabled:true,label:'OR'}); s.blocks.push({id:uid(),type:'webs',enabled:true,webs:s.web_links}); }
  delete s.apps; delete s.web_links;
}
function addBlock(si,type){
  const s=CFG.sections[si];
  const b={id:uid(),type,enabled:true};
  if(type==='apps') b.apps=[newApp()];
  else if(type==='webs') b.webs=[newWeb()];
  else if(type==='tiles'){b.tiles=[newTile()];b.columns=2;}
  else if(type==='text'){b.heading='Heading';b.body='Some text here.';}
  else if(type==='button'){b.text='Open';b.url='https://';b.colors=['#e8163a','#b8102e'];b.new_tab=true;}
  else if(type==='divider') b.label='OR';
  s.blocks.push(b);touch();
}
function blockEditor(b,si,bi){
  const p=`CFG.sections[${si}].blocks[${bi}]`;
  const head=`<div class="item-head"><span class="block-type">${b.type}</span><span class="sp"></span><div class="reorder"><button class="btn sm" onclick="move(CFG.sections[${si}].blocks,${bi},-1)">▲</button><button class="btn sm" onclick="move(CFG.sections[${si}].blocks,${bi},1)">▼</button></div>${switchEl(b.enabled,`${p}.enabled=this.checked`)}<button class="btn sm danger" onclick="CFG.sections[${si}].blocks.splice(${bi},1);touch()">✕</button></div>`;
  let body='';
  if(b.type==='apps'){
    b.apps=b.apps||[];
    body=b.apps.map((a,ai)=>appEditor(a,`${p}.apps`,ai)).join('')+`<button class="btn sm" onclick="${p}.apps.push(newApp());touch()">+ Add app</button>`;
  }else if(b.type==='webs'){
    b.webs=b.webs||[];
    body=b.webs.map((w,wi)=>webEditor(w,`${p}.webs`,wi)).join('')+`<button class="btn sm" onclick="${p}.webs.push(newWeb());touch()">+ Add web link</button>`;
  }else if(b.type==='tiles'){
    b.tiles=b.tiles||[];
    body=txt('Columns',b.columns||2,`${p}.columns=parseInt(this.value)||2`)+b.tiles.map((t,ti)=>`<div class="item"><div class="item-head"><span class="title">${esc(t.title||'Tile')}</span><div class="reorder"><button class="btn sm" onclick="move(${p}.tiles,${ti},-1)">▲</button><button class="btn sm" onclick="move(${p}.tiles,${ti},1)">▼</button></div>${switchEl(t.enabled,`${p}.tiles[${ti}].enabled=this.checked`)}</div>${tileEditor(t,`${p}.tiles[${ti}]`)}<button class="btn sm danger" onclick="${p}.tiles.splice(${ti},1);touch()">Delete</button></div>`).join('')+`<button class="btn sm" onclick="${p}.tiles.push(newTile());touch()">+ Add tile</button>`;
  }else if(b.type==='text'){
    body=txt('Heading',b.heading,`${p}.heading=this.value`)+area('Body',b.body,`${p}.body=this.value`);
  }else if(b.type==='button'){
    b.colors=b.colors||['#e8163a','#b8102e'];
    body=`<div class="row">${txt('Button text',b.text,`${p}.text=this.value`)}${txt('URL',b.url,`${p}.url=this.value`)}</div><div class="row">${color('Color 1',b.colors[0],`${p}.colors[0]=this.value`)}${color('Color 2',b.colors[1],`${p}.colors[1]=this.value`)}</div><label style="display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim)">${switchEl(b.new_tab,`${p}.new_tab=this.checked`)} Open in new tab</label>`;
  }else if(b.type==='divider'){
    body=txt('Divider label',b.label,`${p}.label=this.value`);
  }
  return `<div class="item">${head}${body}</div>`;
}

function appEditor(a,arrPath,ai){
  const p=`${arrPath}[${ai}]`;
  ensureLogo(a);
  a.badge_colors=a.badge_colors||['#e8163a','#f43f5e'];
  a.btn_colors=a.btn_colors||['#e8163a','#b8102e'];
  const feats=(a.features||[]).map((f,fi)=>`<div class="feat-row"><input type="text" value="${attr(f)}" oninput="${p}.features[${fi}]=this.value"><button class="btn sm danger" onclick="${p}.features.splice(${fi},1);touch()">✕</button></div>`).join('');
  return `<div class="item"><div class="item-head"><span class="title">${esc(a.name||'App')}</span><div class="reorder"><button class="btn sm" onclick="move(${arrPath},${ai},-1)">▲</button><button class="btn sm" onclick="move(${arrPath},${ai},1)">▼</button></div>${switchEl(a.enabled,`${p}.enabled=this.checked`)}</div>
    ${logoEditor(a.logo,`${p}.logo`)}
    <div class="row">${txt('Name',a.name,`${p}.name=this.value`)}${txt('Version',a.version,`${p}.version=this.value`)}</div>
    <div class="row">${txt('Size text',a.size_text,`${p}.size_text=this.value`)}${txt('Button text',a.btn_text,`${p}.btn_text=this.value`)}</div>
    ${txt('Download URL (blank = dummy)',a.download_url,`${p}.download_url=this.value`,'https://...apk')}
    <div class="row">${txt('Badge text',a.badge_text,`${p}.badge_text=this.value`)}${color('Badge text color',a.badge_text_color,`${p}.badge_text_color=this.value`)}</div>
    <div class="row">${color('Badge grad 1',a.badge_colors[0],`${p}.badge_colors[0]=this.value`)}${color('Badge grad 2',a.badge_colors[1],`${p}.badge_colors[1]=this.value`)}</div>
    <div class="row">${color('Button grad 1',a.btn_colors[0],`${p}.btn_colors[0]=this.value`)}${color('Button grad 2',a.btn_colors[1],`${p}.btn_colors[1]=this.value`)}</div>
    <div class="row">${color('Button text color',a.btn_text_color,`${p}.btn_text_color=this.value`)}${color('Check color',a.feature_check_color,`${p}.feature_check_color=this.value`)}</div>
    ${color('Check bg',a.feature_check_bg,`${p}.feature_check_bg=this.value`)}
    <div style="font-size:11px;font-weight:600;color:var(--dim);margin:8px 0 5px;text-transform:uppercase">Features<button class="btn sm" style="margin-left:6px" onclick="${p}.features=${p}.features||[];${p}.features.push('New feature');touch()">+ Add</button></div>
    ${feats}
    <button class="btn sm danger" style="margin-top:8px" onclick="${arrPath}.splice(${ai},1);touch()">Delete app</button>
  </div>`;
}
function webEditor(w,arrPath,wi){
  const p=`${arrPath}[${wi}]`;
  return `<div class="item"><div class="item-head"><span class="title">${esc(w.name||'Web link')}</span><div class="reorder"><button class="btn sm" onclick="move(${arrPath},${wi},-1)">▲</button><button class="btn sm" onclick="move(${arrPath},${wi},1)">▼</button></div>${switchEl(w.enabled,`${p}.enabled=this.checked`)}</div>
    <div class="row">${txt('Name',w.name,`${p}.name=this.value`)}${txt('Icon (emoji)',w.icon,`${p}.icon=this.value`)}</div>
    ${txt('URL',w.url,`${p}.url=this.value`,'https://...')}
    ${txt('Description',w.description,`${p}.description=this.value`)}
    <div class="row">${txt('Badge',w.badge,`${p}.badge=this.value`)}${txt('Button text',w.btn_text,`${p}.btn_text=this.value`)}</div>
    <button class="btn sm danger" onclick="${arrPath}.splice(${wi},1);touch()">Delete web link</button>
  </div>`;
}

/* ---------- MAINTENANCE ---------- */
function renderMaintenance(){
  const m=CFG.maintenance=CFG.maintenance||{enabled:false,icon:'🔧',title:'Under Maintenance',message:'',show_telegram:true};
  return `<div class="hint">When ON, the whole public site is replaced by a maintenance screen until you turn it off.</div>
  <div class="card"><h3>Maintenance Mode<span class="sp"></span><span style="font-size:12px;font-weight:700;color:${m.enabled?'#ff6b6b':'var(--green)'}">${m.enabled?'● SITE IS DOWN':'○ Site is live'}</span></h3>
    <label style="display:flex;align-items:center;gap:10px;margin-bottom:16px">${switchEl(m.enabled,`CFG.maintenance.enabled=this.checked;touch()`)}<span style="font-weight:600">Put site under maintenance</span></label>
    ${txt('Icon (emoji)',m.icon,`CFG.maintenance.icon=this.value`)}
    ${txt('Title',m.title,`CFG.maintenance.title=this.value`)}
    ${area('Message',m.message,`CFG.maintenance.message=this.value`)}
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin-top:8px">${switchEl(m.show_telegram,`CFG.maintenance.show_telegram=this.checked`)} Show Telegram button</label>
  </div>`;
}

/* ---------- FOOTER / META / REMOTE ---------- */
function renderFooter(){
  const f=CFG.footer=CFG.footer||{};f.links=f.links||[];
  const links=f.links.map((l,i)=>`<div class="item"><div class="row">${txt('Label',l.label,`CFG.footer.links[${i}].label=this.value`)}${txt('URL',l.url,`CFG.footer.links[${i}].url=this.value`)}</div><button class="btn sm danger" onclick="CFG.footer.links.splice(${i},1);touch()">Remove</button></div>`).join('');
  return `<div class="card"><h3>Footer</h3>${txt('Telegram URL',f.telegram_url,`CFG.footer.telegram_url=this.value`)}${txt('Telegram button text',f.telegram_text,`CFG.footer.telegram_text=this.value`)}${txt('Status text',f.status_text,`CFG.footer.status_text=this.value`)}${txt('Copyright',f.copyright,`CFG.footer.copyright=this.value`)}</div><div class="card"><h3>Footer links<span class="sp"></span><button class="btn sm" onclick="CFG.footer.links.push({label:'New',url:''});touch()">+ Add</button></h3>${links||'<div class="subtle">None</div>'}</div>`;
}
function renderMeta(){
  const m=CFG.meta=CFG.meta||{};
  return `<div class="card"><h3>Meta / SEO</h3>${txt('Site title',m.site_title,`CFG.meta.site_title=this.value`)}${area('Description',m.description,`CFG.meta.description=this.value`)}<div class="row">${color('Theme color',m.theme_color,`CFG.meta.theme_color=this.value`)}${txt('OG image URL',m.og_image,`CFG.meta.og_image=this.value`)}</div>${txt('Favicon',m.favicon,`CFG.meta.favicon=this.value`)}</div>`;
}
function renderRemote(){
  const rf=CFG.remote_fetch=CFG.remote_fetch||{mappings:[]};rf.mappings=rf.mappings||[];
  const maps=rf.mappings.map((m,i)=>`<div class="item"><div class="row3">${txt('JSON key',m.json_key,`CFG.remote_fetch.mappings[${i}].json_key=this.value`)}${txt('Target app/tile id',m.target_app,`CFG.remote_fetch.mappings[${i}].target_app=this.value`)}${sel('Field',m.field||'download_url',['download_url','version','action_target'],`CFG.remote_fetch.mappings[${i}].field=this.value`)}</div><button class="btn sm danger" onclick="CFG.remote_fetch.mappings.splice(${i},1);touch()">Remove</button></div>`).join('');
  return `<div class="hint">Keys from your GitHub <code>loaded</code> file override app fields live (download URLs, versions).</div><div class="card"><h3>Remote fetch URL</h3>${txt('URL',rf.url,`CFG.remote_fetch.url=this.value`)}</div><div class="card"><h3>Mappings<span class="sp"></span><button class="btn sm" onclick="CFG.remote_fetch.mappings.push({json_key:'',target_app:'',field:'download_url'});touch()">+ Add mapping</button></h3>${maps||'<div class="subtle">None</div>'}</div>`;
}

/* ---------- FACTORIES ---------- */

function newApp(){return{id:uid(),name:'New App',logo:{type:'text',text:'A',colors:['#e8163a','#b8102e']},badge_text:'',badge_colors:['#e8163a','#f43f5e'],badge_text_color:'#fff',version:'1.0',download_url:'',btn_text:'Download APK',btn_colors:['#e8163a','#b8102e'],btn_text_color:'#fff',size_text:'Android · Free',features:['Feature one'],feature_check_color:'#e8163a',feature_check_bg:'rgba(232,22,58,.15)',enabled:true};}
