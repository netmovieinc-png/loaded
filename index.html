<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{width:100%;overflow-x:hidden}
body{font-family:'Inter',sans-serif;background:#050507;color:#f0f0f0;-webkit-font-smoothing:antialiased}

/* ═══ GLOW ═══ */
.glow-bg{position:fixed;top:-250px;left:50%;transform:translateX(-50%);width:900px;height:900px;background:radial-gradient(ellipse,rgba(232,22,58,.05) 0%,rgba(232,22,58,.02) 30%,transparent 65%);pointer-events:none;z-index:0;border-radius:50%;animation:glowFloat 8s ease-in-out infinite}
@keyframes glowFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(30px)}}
.glow-orb{position:fixed;width:400px;height:400px;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px);opacity:.035}
.glow-orb.orb1{top:60%;right:-100px;background:#e8163a;animation:orbD1 12s ease-in-out infinite}
.glow-orb.orb2{bottom:20%;left:-100px;background:#7c3aed;animation:orbD2 15s ease-in-out infinite}
@keyframes orbD1{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-60px)}}
@keyframes orbD2{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,40px)}}

/* ═══ PARTICLES ═══ */
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;width:2px;height:2px;background:rgba(232,22,58,.3);border-radius:50%;animation:pFloat linear infinite}
@keyframes pFloat{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}

/* ═══ REVEAL ═══ */
.reveal{opacity:0;transform:translateY(40px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.reveal.from-scale{transform:scale(.9)}
.reveal.visible{opacity:1;transform:translateY(0) scale(1)}
.stagger .reveal:nth-child(1){transition-delay:.05s}
.stagger .reveal:nth-child(2){transition-delay:.1s}
.stagger .reveal:nth-child(3){transition-delay:.15s}
.stagger .reveal:nth-child(4){transition-delay:.2s}
.stagger .reveal:nth-child(5){transition-delay:.25s}
.stagger .reveal:nth-child(6){transition-delay:.3s}
.stagger .reveal:nth-child(7){transition-delay:.35s}
.stagger .reveal:nth-child(8){transition-delay:.4s}

/* ═══ NAV ═══ */
nav{position:sticky;top:0;z-index:100;background:rgba(5,5,7,.85);backdrop-filter:blur(20px) saturate(1.8);border-bottom:1px solid rgba(255,255,255,.05);padding:.8rem 0;transition:.3s}
nav.scrolled{background:rgba(5,5,7,.95);box-shadow:0 4px 30px rgba(0,0,0,.5)}
.nav-inner{max-width:1100px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:16px;overflow:hidden}
.nav-logo img{width:100%;height:100%;object-fit:cover}
.nav-name{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
.nav-tg{display:inline-flex;align-items:center;gap:.45rem;background:linear-gradient(135deg,#0088cc,#006699);color:#fff;font-size:.8rem;font-weight:700;padding:.5rem 1.3rem;border-radius:8px;text-decoration:none;transition:.3s;overflow:hidden}
.nav-tg:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,136,204,.4)}
.nav-tg svg{width:16px;height:16px;fill:#fff}

/* ═══ HERO ═══ */
.hero{max-width:760px;margin:0 auto;padding:5rem 1.5rem 4rem;position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center}
.hero-badge{display:inline-flex;align-items:center;gap:.5rem;background:rgba(232,22,58,.08);border:1px solid rgba(232,22,58,.2);border-radius:20px;padding:.3rem .95rem;font-size:.72rem;font-weight:600;color:#e8163a;margin-bottom:1.2rem;backdrop-filter:blur(10px);animation:fadeDown .6s ease-out}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.dot{width:6px;height:6px;border-radius:50%;background:#e8163a;box-shadow:0 0 8px rgba(232,22,58,.6);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.6)}}
.hero-title{font-family:'Space Grotesk',sans-serif;font-size:3.4rem;font-weight:700;line-height:1.05;letter-spacing:-.035em;margin-bottom:1rem;animation:fadeUp .7s ease-out .1s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
.hl{background:linear-gradient(135deg,#e8163a,#ff4757);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:1rem;color:rgba(240,240,240,.5);line-height:1.8;margin-bottom:1.2rem;max-width:460px;animation:fadeUp .7s ease-out .2s both}
.lang-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:1.8rem;animation:fadeUp .7s ease-out .25s both}
.lang-pill{padding:4px 14px;border-radius:20px;font-size:11px;font-weight:600;color:rgba(240,240,240,.5);border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.025)}
.feat-row{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-bottom:2rem;animation:fadeUp .7s ease-out .3s both}
.feat-item{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:rgba(240,240,240,.55)}
.feat-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px}
.feat-ic img{width:16px;height:16px;object-fit:contain}
.stats-row{display:flex;gap:2rem;flex-wrap:wrap;justify-content:center;margin-top:2.2rem;animation:fadeUp .7s ease-out .4s both}
.stat-num{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,#e8163a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-lbl{font-size:.65rem;color:rgba(240,240,240,.28);text-transform:uppercase;letter-spacing:.1em;margin-top:.15rem}

/* ═══ SECTIONS ═══ */
.section{padding:5rem 0;position:relative;z-index:1}
.section.alt{background:rgba(255,255,255,.015)}
.wrap{max-width:1100px;margin:0 auto;padding:0 1.5rem}

.sec-title{font-family:'Space Grotesk',sans-serif;font-size:1.9rem;font-weight:700;letter-spacing:-.025em}
.sec-sub{color:rgba(240,240,240,.45);font-size:.86rem;margin-top:.55rem}
.divider{width:48px;height:3px;background:linear-gradient(90deg,#e8163a,#ff4757);border-radius:2px;margin:.8rem auto 0;position:relative}
.divider::after{content:'';position:absolute;inset:-3px;background:linear-gradient(90deg,#e8163a,#ff4757);filter:blur(8px);opacity:.4;border-radius:2px}

/* ═══ APP CARDS ═══ */
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.app-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:1.6rem 1.2rem 1.2rem;text-align:center;transition:.4s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.app-card::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top,rgba(232,22,58,.06),transparent 70%);opacity:0;transition:.35s;pointer-events:none}
.app-card:hover{border-color:rgba(232,22,58,.2);transform:translateY(-5px);box-shadow:0 12px 35px rgba(0,0,0,.3),0 0 20px rgba(232,22,58,.06)}
.app-card:hover::after{opacity:1}
.app-tag{position:absolute;top:-1px;left:50%;transform:translateX(-50%);padding:3px 12px;border-radius:0 0 8px 8px;font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;z-index:3}
.app-logo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin:0 auto 12px;font-size:20px;font-weight:900;color:#fff;overflow:hidden}
.app-logo img{width:100%;height:100%;object-fit:cover}
.app-name{font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:700;margin-bottom:3px}
.app-ver{font-size:11px;color:rgba(240,240,240,.25);margin-bottom:14px}
.app-feats{text-align:left;list-style:none;margin-bottom:14px}
.app-feats li{font-size:11px;color:rgba(240,240,240,.45);padding:3px 0;display:flex;align-items:center;gap:7px}
.app-feats li .ck{font-size:10px;font-weight:800;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.dl-btn{display:block;width:100%;padding:11px;border-radius:10px;font-size:13px;font-weight:800;text-decoration:none;color:#fff;text-align:center;transition:.3s;position:relative;overflow:hidden}
.dl-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);opacity:0;transition:.3s}
.dl-btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.dl-btn:hover::before{opacity:1}

/* ═══ WEB CARDS ═══ */
.web-grid{display:grid;gap:12px;max-width:640px;margin:0 auto}
.web-card{border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);padding:20px 22px;display:flex;align-items:center;gap:16px;transition:.35s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.web-card:hover{border-color:rgba(16,185,129,.2);transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,.3)}

.web-icon{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#000000,#000000);display:grid;place-items:center;font-size:20px;flex-shrink:0;color:#fff}

.cat-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:1.4rem;text-align:center;transition:.4s cubic-bezier(.16,1,.3,1);text-decoration:none;color:#f0f0f0;cursor:pointer;position:relative;overflow:hidden}

.cat-title{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:700;margin-bottom:4px}
.cat-desc{font-size:.78rem;color:rgba(240,240,240,.45);line-height:1.6}

.final-btn{display:inline-flex;align-items:center;gap:.55rem;background:linear-gradient(135deg,#e8163a,#b8102e);color:#fff;font-size:.92rem;font-weight:700;padding:.85rem 2.2rem;border-radius:50px;text-decoration:none;transition:.35s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.final-btn::after{content:'';position:absolute;inset:-2px;border-radius:52px;background:linear-gradient(135deg,#e8163a,#ff4757,#e8163a);z-index:-1;animation:bGlow 3s ease-in-out infinite;filter:blur(8px);opacity:.5}
@keyframes bGlow{0%,100%{opacity:.4}50%{opacity:.7}}
.final-btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 40px rgba(232,22,58,.5)}

/* ═══ FOOTER ═══ */
footer{border-top:1px solid rgba(255,255,255,.05);padding:2rem 1.5rem;position:relative;z-index:1}
.ft-inner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.ft-tg{display:inline-flex;align-items:center;gap:10px;padding:10px 24px;border-radius:40px;background:linear-gradient(135deg,#0088cc,#006699);color:#fff;font-size:13px;font-weight:600;text-decoration:none;transition:.3s}
.ft-tg:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,136,204,.3)}
.ft-tg svg{width:18px;height:18px;fill:#fff}
.ft-status{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(240,240,240,.2)}
.ft-dot{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pulse 2.5s ease-in-out infinite}
.ft-links{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.ft-links a{font-size:11px;color:rgba(240,240,240,.2);text-decoration:none;transition:.2s}
.ft-links a:hover{color:#e8163a}
.ft-copy{font-size:10px;color:rgba(240,240,240,.18)}
.ft-disclaimer{font-size:10px;color:rgba(240,240,240,.15);max-width:560px;text-align:center;line-height:1.6;margin-top:4px}

/* ═══ TOAST ═══ */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(20,20,22,.95);color:#fff;padding:.7rem 1.5rem;border-radius:10px;font-size:.84rem;z-index:9999;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(20px);box-shadow:0 8px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:.5rem;opacity:0;animation:toastIn .3s ease-out forwards}
@keyframes toastIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ═══ BOOT / ERR / MAINT ═══ */
#boot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#050507}
#boot .dots{display:flex;gap:8px}
#boot .d{width:11px;height:11px;border-radius:50%;background:#e8163a;animation:bounce .6s ease-in-out infinite}
#boot .d:nth-child(2){animation-delay:.15s;background:#7c3aed}
#boot .d:nth-child(3){animation-delay:.3s;background:#06b6d4}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
#err{display:none;position:fixed;inset:0;z-index:40;place-items:center;text-align:center;padding:30px;background:#050507}
#err.show{display:grid}
#err h2{font-family:'Space Grotesk',sans-serif;font-size:22px;margin-bottom:10px}
#err p{color:rgba(240,240,240,.45);font-size:13px;margin-bottom:20px;max-width:320px}
#err button{padding:10px 26px;border-radius:10px;border:none;background:#e8163a;color:#fff;font-weight:700;cursor:pointer}
.maint{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:30px;position:relative;z-index:1}

/* ═══ REDUCED MOTION ═══ */
@media(prefers-reduced-motion:reduce){.reveal{transition:opacity .4s;transform:none!important}.reveal.visible{opacity:1}.particle{display:none}.glow-bg,.glow-orb{animation:none}.dot{animation:none}}

/* ═══ RESPONSIVE ═══ */
@media(max-width:900px){
  .hero{grid-template-columns:1fr;gap:2.5rem;padding:3rem 1.2rem}
  .hero-title{font-size:2.2rem}
  .hero-right{display:none}
  .app-grid{grid-template-columns:repeat(2,1fr)}
  .cat-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .hero-title{font-size:1.8rem}
  .app-grid,.cat-grid{grid-template-columns:1fr;max-width:360px;margin-left:auto;margin-right:auto}
  .web-card{flex-direction:column;text-align:center}
  .web-tag{left:50%;transform:translateX(-50%)}
  .stats-row{gap:1.2rem}
  .sec-title{font-size:1.4rem}
  .section{padding:3.5rem 0}
  .share-box{padding:1.5rem}
  .nav-tg{display:none}
}
</style>

<body>

<div class="glow-bg"></div>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>
<div class="particles" id="particles"></div>

<div id="boot"><div class="dots"><div class="d"></div><div class="d"></div><div class="d"></div></div></div>
<div id="err"><div><h2>Couldn't load</h2><p>We couldn't reach the server. Check your connection and try again.</p><button onclick="location.reload()">Retry</button></div></div>

<!-- SEO fallback content (visible to crawlers before JS renders; replaced on load) -->
<main id="app">
  <h1 style="position:absolute;left:-9999px">NetMovie — Watch Movies, Series, Anime &amp; Live TV Free in HD</h1>
</main>

<script>
const CONFIG_URL="/site-config.json";
const SITE_URL="https://netmovie.site";
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byOrder=(a,b)=>(a.order||0)-(b.order||0);
const on=x=>x&&x.enabled!==false;
let CFG=null;

async function boot(){
  try{
    const r=await fetch(CONFIG_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    CFG=await r.json();
  }catch(e){
    document.getElementById('boot').style.display='none';
    document.getElementById('err').classList.add('show');
    return;
  }
  applyMeta();
  if(CFG.maintenance&&CFG.maintenance.enabled){
    document.getElementById('boot').style.display='none';
    showMaint();return;
  }
  const ru=(CFG.remote_fetch&&CFG.remote_fetch.url)||'';
  if(ru){try{const rr=await fetch(ru+'?t='+Date.now(),{cache:'no-store'});if(rr.ok)applyRemote(await rr.json());}catch(e){}}
  render();
  document.getElementById('boot').style.display='none';
  initReveal();initNav();initParticles();
}

function applyMeta(){
  const m=CFG.meta||{};
  if(m.site_title)document.title=m.site_title;
  const t=document.querySelector('meta[name=theme-color]');if(t&&m.theme_color)t.content=m.theme_color;
  const d=document.querySelector('meta[name=description]');if(d&&m.description)d.content=m.description;
}

function applyRemote(data){
  ((CFG.remote_fetch&&CFG.remote_fetch.mappings)||[]).forEach(m=>{
    const val=data[m.json_key];if(val==null||val==='')return;
    const obj=findById(m.target_app);if(obj){obj[m.field]=val;}
  });
}
function findById(id){
  for(const s of(CFG.sections||[])){
    for(const b of(s.blocks||[]))if(b.type==='apps')for(const a of(b.apps||[]))if(a.id===id)return a;
    for(const a of(s.apps||[]))if(a.id===id)return a;
  }
  for(const t of(CFG.landing_tiles||[]))if(t.id===id)return t;
  for(const g of(CFG.landing_groups||[]))for(const t of(g.tiles||[]))if(t.id===id)return t;
  for(const s of(CFG.sections||[]))for(const b of(s.blocks||[])){
    if(b.type==='webs')for(const w of(b.webs||[]))if(w.id===id)return w;
    if(b.type==='tiles')for(const t of(b.tiles||[]))if(t.id===id)return t;
  }
  return null;
}

function showMaint(){
  const m=CFG.maintenance,f=CFG.footer||{};
  const tg=(m.show_telegram&&f.telegram_url)?`<a href="${esc(f.telegram_url)}" target="_blank" rel="noopener" class="ft-tg" style="margin-top:24px">${tgSvg()}${esc(f.telegram_text||'Join Telegram')}</a>`:'';
  document.getElementById('app').innerHTML=`<div class="maint"><div style="max-width:420px"><div style="font-size:64px;margin-bottom:16px">${esc(m.icon||'🔧')}</div><h1 style="font-family:'Space Grotesk';font-size:28px;margin-bottom:12px">${esc(m.title)}</h1><p style="color:rgba(240,240,240,.45);font-size:14px;line-height:1.7">${esc(m.message)}</p>${tg}</div></div>`;
}

function tgSvg(){return`<svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>`;}

/* ═══ COLLECTORS ═══ */
function collectApps(){
  const apps=[];
  (CFG.sections||[]).forEach(s=>{
    (s.blocks||[]).forEach(b=>{if(b.type==='apps')(b.apps||[]).filter(on).sort(byOrder).forEach(a=>apps.push(a));});
    (s.apps||[]).filter(on).sort(byOrder).forEach(a=>apps.push(a));
  });
  return apps;
}
function collectWebs(){
  const webs=[];
  (CFG.sections||[]).forEach(s=>{
    (s.blocks||[]).forEach(b=>{if(b.type==='webs')(b.webs||[]).filter(on).sort(byOrder).forEach(w=>webs.push(w));});
    (s.web_links||[]).filter(on).sort(byOrder).forEach(w=>webs.push(w));
  });
  return webs;
}

/* ═══ ICON/LOGO HELPERS ═══ */
function logoStyle(logo,lc){if(logo&&logo.type==='image'&&logo.url)return'';const c=(logo&&logo.colors)||lc||['#333','#111'];return`background:linear-gradient(135deg,${esc(c[0])},${esc(c[1]||c[0])})`;}
function logoInner(logo,lt){if(logo&&logo.type==='image'&&logo.url)return`<img src="${esc(logo.url)}" alt="" loading="lazy">`;return esc((logo&&logo.text)||lt||'');}
function tileIcon(t){if(t.icon_type==='image'&&t.icon_img)return`<img src="${esc(t.icon_img)}" alt="" loading="lazy">`;return esc(t.icon||'');}
function webIcon(w){if(w.icon_type==='image'&&w.icon_img)return`<img src="${esc(w.icon_img)}" alt="" loading="lazy">`;return esc(w.icon||'🌐');}
function featIcon(ft){if(ft.icon_type==='image'&&ft.icon_img)return`<img src="${esc(ft.icon_img)}" alt="" loading="lazy">`;return esc(ft.icon||'');}
function hexToRgb(hex){hex=(hex||'#e8163a').replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16);return((n>>16)&255)+','+((n>>8)&255)+','+(n&255);}

/* ═══ RENDER ═══ */

function render(){
  const h=CFG.hero||{},f=CFG.footer||{};
  const apps=collectApps();
  const webs=collectWebs();

  const bl=h.brand_logo;
  const brandInner=(bl&&bl.type==='image'&&bl.url)?`<img src="${esc(bl.url)}" alt="${esc(h.brand_name||'Net')}${esc(h.brand_accent||'Movie')}">`:esc((bl&&bl.text)||h.brand_logo_text||'N');
  const brandStyle=(bl&&bl.type==='image'&&bl.url)?'':`background:linear-gradient(135deg,${esc(h.brand_color||'#e8163a')},#b8102e)`;

  const langs=(h.languages||[]).map(l=>`<span class="lang-pill">${esc(l)}</span>`).join('');
  const feats=(h.features||[]).map(ft=>`<div class="feat-item"><div class="feat-ic" style="background:${esc(ft.bg||'rgba(255,255,255,.08)')}">${featIcon(ft)}</div>${esc(ft.label)}</div>`).join('');
 

  /* app download cards */
  const appCards=apps.map(a=>{
    const bc=a.badge_colors||['#e8163a','#f43f5e'];
    const bt=a.btn_colors||['#e8163a','#b8102e'];
    const href=a.download_url&&a.download_url.trim()?esc(a.download_url):'#';
    const af=(a.features||[]).slice(0,4).map(ft=>`<li><span class="ck" style="background:${esc(a.feature_check_bg||'rgba(232,22,58,.1)')};color:${esc(a.feature_check_color||'#e8163a')}">✓</span>${esc(ft)}</li>`).join('');
    return`<div class="app-card reveal">
      ${a.badge_text?`<div class="app-tag" style="background:linear-gradient(90deg,${esc(bc[0])},${esc(bc[1]||bc[0])});color:${esc(a.badge_text_color||'#fff')}">${esc(a.badge_text)}</div>`:''}
      <div class="app-logo" style="${logoStyle(a.logo,a.logo_colors)}">${logoInner(a.logo,a.logo_text)}</div>
      <div class="app-name">${esc(a.name)}</div>
      <div class="app-ver">v${esc(a.version||'')} · ${esc(a.size_text||'Android · Free')}</div>
      ${af?`<ul class="app-feats">${af}</ul>`:''}
      <a href="${href}" class="dl-btn" style="background:linear-gradient(135deg,${esc(bt[0])},${esc(bt[1]||bt[0])});color:${esc(a.btn_text_color||'#fff')}"${href==='#'?' onclick="return false"':' rel="nofollow"'}>${esc(a.btn_text||'Download APK')}</a>
    </div>`;

    </div>
    ${f.telegram_url?`<a href="${esc(f.telegram_url)}" target="_blank" rel="noopener" class="nav-tg">${tgSvg()}${esc(f.telegram_text||'Join Telegram')}</a>`:''}
  </div></nav>

  <header class="hero">
    <div class="hero-badge"><div class="dot"></div> LIVE · Free HD Streaming</div>
    <h1 class="hero-title">${esc(h.title_line1||'Stream Everything.')}<br><span class="hl">${esc(h.title_line2||'Pay Nothing.')}</span></h1>

  ${apps.length?`

    <div class="wrap">
      <div class="sec-head reveal"><h2 class="sec-title">📥 Download <span class="hl">Apps</span></h2><p class="sec-sub">Free APKs for Android — pick your app</p><div class="divider"></div></div>

  ${webs.length?`

      <div class="pills reveal">${(h.languages||[]).map(l=>`<span class="pill">${esc(l)}</span>`).join('')}</div>
    </div>
  </section>`:''}

  <section class="section alt" aria-label="About NetMovie">
    <div class="wrap reveal">
      <div class="sec-head"><h2 class="sec-title">About <span class="hl">NetMovie</span></h2></div>
      <article class="about">
        <p><strong>NetMovie</strong> is a free streaming platform where you can watch and download <strong>movies, TV series, anime, K-drama and live TV</strong> in full HD — completely free. No sign-up, no subscription, no hidden charges.</p>
        <p>Enjoy the latest <strong>Hollywood and Bollywood films</strong>, binge-worthy <strong>web series</strong>, trending <strong>anime (sub, dub and Hindi dubbed)</strong>, and <strong>Korean, Chinese and Japanese dramas</strong> — all in one place. Content is available in English, Hindi, Urdu, Korean, Japanese, Turkish and more.</p>
        <h3>Live TV &amp; Sports</h3>
        <p>With <strong>NetTV</strong> you get 500+ live channels, and <strong>NetSports</strong> streams live cricket, football, UFC and more in HD. Watch on your phone, tablet or PC — through the free Android apps or directly in your browser.</p>
        <h3>Watch Anywhere</h3>
        <p>Prefer no installs? Open the <strong>NetMovie</strong>, <strong>NetStream</strong> or <strong>NetAnimo</strong> web players on any device — iOS, PC, Mac or Android. New titles are added daily, with multiple fast servers so you never hit a dead link.</p>

    </div>
  </section>

  <div class="section alt" style="padding-top:2rem">
    <div class="wrap">
      <div class="share-box reveal from-scale">
        <div class="share-lbl">Share NetMovie</div>
        <p class="share-desc">Help others find the best free streaming site — share with friends!</p>
        <div class="share-btns">
          <a href="https://api.whatsapp.com/send?text=${shareText}" target="_blank" rel="noopener" class="share-btn wa">
            <svg viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.115.553 4.104 1.523 5.83L0 24l6.34-1.501A11.946 11.946 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.808 9.808 0 01-5.034-1.385l-.36-.214-3.733.883.936-3.617-.235-.371A9.818 9.818 0 012.182 12C2.182 6.58 6.58 2.182 12 2.182S21.818 6.58 21.818 12 17.42 21.818 12 21.818z"/></svg>
            WhatsApp
          </a>
          <a href="https://t.me/share/url?url=${encodeURIComponent(SITE_URL)}&text=${encodeURIComponent('Best free streaming site!')}" target="_blank" rel="noopener" class="share-btn tg-share">
            ${tgSvg()}Telegram
          </a>
          <button onclick="copyLink()" class="share-btn cp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            Copy Link
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="final-cta reveal from-scale">
    <h2 style="font-family:'Space Grotesk';font-size:2rem;font-weight:700;letter-spacing:-.03em;margin-bottom:.6rem">Ready to Watch?</h2>
    <p style="color:rgba(240,240,240,.45);font-size:.9rem;margin-bottom:1.5rem">Stream everything free — movies, series, anime, live TV</p>
    ${webs.length?`<a href="${esc(webs[0].url)}" target="_blank" rel="noopener" class="final-btn">🌐 Open Web Player →</a>`:''}
  </div>

  <footer><div class="ft-inner">
    ${f.telegram_url?`<a href="${esc(f.telegram_url)}" target="_blank" rel="noopener" class="ft-tg">${tgSvg()}${esc(f.telegram_text||'Join Telegram')}</a>`:''}
    ${f.status_text?`<div class="ft-status"><span class="ft-dot"></span>${esc(f.status_text)}</div>`:''}
    ${flinks?`<div class="ft-links">${flinks}</div>`:''}
    ${f.copyright?`<div class="ft-copy">${esc(f.copyright)}</div>`:''}
    <div class="ft-disclaimer">NetMovie does not host any files on its servers. All content is provided by non-affiliated third parties.</div>
  </div></footer>`;
}

function faqItem(q,a){
  return`<div class="faq-item reveal"><button class="faq-q" onclick="faq(this)">${esc(q)}<span class="faq-ic">+</span></button><div class="faq-a">${esc(a)}</div></div>`;
}

/* ═══ INTERACTIONS ═══ */
function copyLink(){navigator.clipboard.writeText(window.location.origin).then(()=>showToast('Link copied!')).catch(()=>showToast('Copy failed'));}
function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},2200);}
function faq(btn){btn.classList.toggle('on');btn.nextElementSibling.classList.toggle('on');}
window.copyLink=copyLink;window.faq=faq;

function initReveal(){
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}});},{threshold:.12,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
}
function initNav(){const nav=document.getElementById('mainNav');if(!nav)return;window.addEventListener('scroll',()=>{if(window.pageYOffset>50)nav.classList.add('scrolled');else nav.classList.remove('scrolled');},{passive:true});}
function initParticles(){const c=document.getElementById('particles');if(!c||window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<20;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(8+Math.random()*12)+'s';p.style.animationDelay=Math.random()*10+'s';p.style.width=p.style.height=(1+Math.random()*2)+'px';c.appendChild(p);}}

boot();
</script>
</body>
</html>
