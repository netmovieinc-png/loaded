    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        html,
        body {
            width: 100%;
            overflow-x: hidden
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: #050507;
            color: #f0f0f0;
            -webkit-font-smoothing: antialiased
        }

        /* ═══ GLOW SYSTEM ═══ */
        .glow-bg {
            position: fixed;
            top: -250px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 900px;
            background: radial-gradient(ellipse, rgba(232, 22, 58, .05) 0%, rgba(232, 22, 58, .02) 30%, transparent 65%);
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
            animation: glowFloat 8s ease-in-out infinite
        }

        @keyframes glowFloat {

            0%,
            100% {
                transform: translateX(-50%) translateY(0)
            }

            50% {
                transform: translateX(-50%) translateY(30px)
            }
        }

        .glow-orb {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
            opacity: .035
        }

        .glow-orb.orb1 {
            top: 60%;
            right: -100px;
            background: #e8163a;
            animation: orbD1 12s ease-in-out infinite
        }

        .glow-orb.orb2 {
            bottom: 20%;
            left: -100px;
            background: #7c3aed;
            animation: orbD2 15s ease-in-out infinite
        }

        @keyframes orbD1 {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(-40px, -60px)
            }
        }

        @keyframes orbD2 {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(40px, 40px)
            }
        }

        /* ═══ PARTICLES ═══ */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(232, 22, 58, .3);
            border-radius: 50%;
            animation: pFloat linear infinite
        }

        @keyframes pFloat {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0
            }

            10% {
                opacity: 1
            }

            90% {
                opacity: 1
            }

            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0
            }
        }

        /* ═══ SCROLL REVEAL ═══ */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity .7s cubic-bezier(.16, 1, .3, 1), transform .7s cubic-bezier(.16, 1, .3, 1)
        }

        .reveal.from-scale {
            transform: scale(.9)
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0) scale(1)
        }

        .stagger .reveal:nth-child(1) {
            transition-delay: .05s
        }

        .stagger .reveal:nth-child(2) {
            transition-delay: .1s
        }

        .stagger .reveal:nth-child(3) {
            transition-delay: .15s
        }

        .stagger .reveal:nth-child(4) {
            transition-delay: .2s
        }

        .stagger .reveal:nth-child(5) {
            transition-delay: .25s
        }

        .stagger .reveal:nth-child(6) {
            transition-delay: .3s
        }

        .stagger .reveal:nth-child(7) {
            transition-delay: .35s
        }

        .stagger .reveal:nth-child(8) {
            transition-delay: .4s
        }

        /* ═══ NAV ═══ */
        nav {

            top: 0;

            display: block;
            height: 42px;
            line-height: 42px
        }

        .cat-icon img {
            height: 42px;
            width: 42px;
            object-fit: contain;
            display: inline-block
        }

        .cat-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 9px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: .4px
        }

        .cat-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: .9rem;
            font-weight: 700;
            margin-bottom: 4px
        }

        .cat-desc {
            font-size: .78rem;
            color: rgba(240, 240, 240, .45);
            line-height: 1.6
        }

        /* ═══ SHARE BOX ═══ */
        .share-box {
            background: rgba(255, 255, 255, .03);
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 16px;
            padding: 2.8rem;
            text-align: center;
            max-width: 620px;
            margin: 0 auto;
            position: relative;
            overflow: hidden
        }

        .share-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(232, 22, 58, .2), transparent)
        }

        .share-lbl {
            font-size: 1.6rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            margin-bottom: .5rem
        }

        .share-desc {
            font-size: .84rem;
            color: rgba(240, 240, 240, .45);
            margin-bottom: 1.4rem
        }

        .share-btns {
            display: flex;
            gap: .6rem;
            justify-content: center;
            flex-wrap: wrap
        }

        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            color: #fff;
            padding: .55rem 1.2rem;
            border-radius: 10px;
            font-size: .82rem;
            font-weight: 700;
            text-decoration: none;
            transition: .3s;
            border: none;
            cursor: pointer;
            overflow: hidden
        }

        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, .3)
        }

        .share-btn svg {
            width: 16px;
            height: 16px
        }

        .share-btn.wa {
            background: #25d366
        }

        .share-btn.tg-share {
            background: #0088cc
        }

        .share-btn.cp {
            background: rgba(255, 255, 255, .06);
            color: #f0f0f0;
            border: 1px solid rgba(255, 255, 255, .1)
        }

        /* ═══ PILLS ═══ */
        .pills {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            justify-content: center
        }

        .pill {
            background: rgba(255, 255, 255, .03);
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 20px;
            padding: .35rem 1rem;
            font-size: .78rem;
            color: rgba(240, 240, 240, .55);
            transition: .3s;
            cursor: default
        }

        .pill:hover {
            border-color: rgba(232, 22, 58, .25);
            color: #f0f0f0;
            background: rgba(232, 22, 58, .06);
            transform: translateY(-2px)
        }

        /* ═══ FINAL CTA ═══ */
        .final-cta {
            text-align: center;
            padding: 5.5rem 1.5rem;
            position: relative;
            z-index: 1;
            overflow: hidden
        }

        .final-cta::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(ellipse, rgba(232, 22, 58, .06), transparent 70%);
            pointer-events: none
        }

        .final-btn {
            display: inline-flex;
            align-items: center;
            gap: .55rem;
            background: linear-gradient(135deg, #e8163a, #b8102e);
            color: #fff;
            font-size: .92rem;
            font-weight: 700;
            padding: .85rem 2.2rem;
            border-radius: 50px;
            text-decoration: none;
            transition: .35s cubic-bezier(.16, 1, .3, 1);
            position: relative;
            overflow: hidden
        }

        .final-btn::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 52px;
            background: linear-gradient(135deg, #e8163a, #ff4757, #e8163a);
            z-index: -1;
            animation: bGlow 3s ease-in-out infinite;
            filter: blur(8px);
            opacity: .5
        }

        @keyframes bGlow {

            0%,
            100% {
                opacity: .4
            }

            50% {
                opacity: .7
            }
        }

        .final-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 40px rgba(232, 22, 58, .5)
        }

        /* ═══ FOOTER ═══ */
        footer {
            border-top: 1px solid rgba(255, 255, 255, .05);
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 1
        }

        .ft-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px
        }

        .ft-tg {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            border-radius: 40px;
            background: linear-gradient(135deg, #0088cc, #006699);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: .3s
        }

        .ft-tg:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 136, 204, .3)
        }

        .ft-tg svg {
            width: 18px;
            height: 18px;
            fill: #fff
        }

        .ft-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: rgba(240, 240, 240, .2)
        }

        .ft-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2.5s ease-in-out infinite
        }

        .ft-links {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center
        }

        .ft-links a {
            font-size: 11px;
            color: rgba(240, 240, 240, .2);
            text-decoration: none;
            transition: .2s
        }

        .ft-links a:hover {
            color: #e8163a
        }

        .ft-copy {
            font-size: 10px;
            color: rgba(240, 240, 240, .18)
        }

        /* ═══ TOAST ═══ */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(20, 20, 22, .95);
            color: #fff;
            padding: .7rem 1.5rem;
            border-radius: 10px;
            font-size: .84rem;
            z-index: 9999;
            border: 1px solid rgba(255, 255, 255, .08);
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, .5);
            display: flex;
            align-items: center;
            gap: .5rem;
            opacity: 0;
            animation: toastIn .3s ease-out forwards
        }

        @keyframes toastIn {
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0)
            }
        }

        /* ═══ BOOT / MAINT / ERROR ═══ */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: grid;
            place-items: center;
            background: #050507
        }

        #boot .dots {
            display: flex;
            gap: 8px
        }

        #boot .d {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #e8163a;
            animation: bounce .6s ease-in-out infinite
        }

        #boot .d:nth-child(2) {
            animation-delay: .15s;
            background: #7c3aed
        }

        #boot .d:nth-child(3) {
            animation-delay: .3s;
            background: #06b6d4
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-14px)
            }
        }

        #err {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 40;
            place-items: center;
            text-align: center;
            padding: 30px;
            background: #050507
        }

        #err.show {
            display: grid
        }

        #err h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            margin-bottom: 10px
        }

        #err p {
            color: rgba(240, 240, 240, .45);
            font-size: 13px;
            margin-bottom: 20px;
            max-width: 320px
        }

        #err button {
            padding: 10px 26px;
            border-radius: 10px;
            border: none;
            background: #e8163a;
            color: #fff;
            font-weight: 700;
            cursor: pointer
        }

        .maint {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 30px;
            position: relative;
            z-index: 1
        }

        /* ═══ REDUCED MOTION ═══ */
        @media(prefers-reduced-motion:reduce) {
            .reveal {
                transition: opacity .4s;
                transform: none !important
            }

            .reveal.visible {
                opacity: 1
            }

            .particle {
                display: none
            }

            .glow-bg,
            .glow-orb {
                animation: none
            }

            .dot {
                animation: none
            }
        }

        /* ═══ RESPONSIVE ═══ */
        @media(max-width:900px) {
            .hero {
                grid-template-columns: 1fr;
                gap: 2.5rem;
                padding: 3rem 1.2rem
            }

            .hero-title {
                font-size: 2.2rem
            }

            .hero-right {
                display: none
            }

            .app-grid {
                grid-template-columns: repeat(2, 1fr)
            }

            .cat-grid {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        @media(max-width:600px) {
            .hero-title {
                font-size: 1.8rem
            }

            .app-grid,
            .cat-grid {
                grid-template-columns: 1fr;
                max-width: 360px;
                margin-left: auto;
                margin-right: auto
            }

            .web-card {
                flex-direction: column;
                text-align: center
            }

            .web-tag {
                left: 50%;
                transform: translateX(-50%)
            }

            .stats-row {
                gap: 1.2rem
            }

            .sec-title {
                font-size: 1.4rem
            }

            .section {
                padding: 3.5rem 0
            }

            .share-box {
                padding: 1.5rem
            }

            .nav-tg {
                display: none
            }
        }
    </style>
</head>

<body>

    <div class="glow-bg"></div>
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>
    <div class="particles" id="particles"></div>

    <div id="boot">
        <div class="dots">
            <div class="d"></div>
            <div class="d"></div>
            <div class="d"></div>
        </div>
    </div>
    <div id="err">
        <div>
            <h2>Couldn't load</h2>
            <p>We couldn't reach the server. Check your connection and try again.</p><button
                onclick="location.reload()">Retry</button>
        </div>
    </div>

    <main id="app"></main>

    <script>
        const CONFIG_URL = "/site-config.json";
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const byOrder = (a, b) => (a.order || 0) - (b.order || 0);
        const on = x => x && x.enabled !== false;
        let CFG = null;

        async function boot() {
            try {
                const r = await fetch(CONFIG_URL + '?t=' + Date.now(), { cache: 'no-store' });
                if (!r.ok) throw 0;
                CFG = await r.json();
            } catch (e) {
                document.getElementById('boot').style.display = 'none';
                document.getElementById('err').classList.add('show');
                return;
            }
            applyMeta();
            if (CFG.maintenance && CFG.maintenance.enabled) {
                document.getElementById('boot').style.display = 'none';
                showMaint(); return;
            }
            /* remote fetch */
            const ru = (CFG.remote_fetch && CFG.remote_fetch.url) || '';
            if (ru) { try { const rr = await fetch(ru + '?t=' + Date.now(), { cache: 'no-store' }); if (rr.ok) applyRemote(await rr.json()); } catch (e) { } }
            render();
            document.getElementById('boot').style.display = 'none';
            initReveal(); initNav(); initParticles();
        }

        function applyMeta() {
            const m = CFG.meta || {};
            if (m.site_title) document.title = m.site_title;
            const t = document.querySelector('meta[name=theme-color]'); if (t && m.theme_color) t.content = m.theme_color;
            const d = document.querySelector('meta[name=description]'); if (d && m.description) d.content = m.description;
        }
        function applyRemote(data) {
            ((CFG.remote_fetch && CFG.remote_fetch.mappings) || []).forEach(m => {
                const val = data[m.json_key]; if (val == null || val === '') return;
                const app = findById(m.target_app); if (app) { app[m.field] = val; }
            });
        }
        function findById(id) {
            for (const s of (CFG.sections || [])) {
                for (const b of (s.blocks || [])) if (b.type === 'apps') for (const a of (b.apps || [])) if (a.id === id) return a;
                for (const a of (s.apps || [])) if (a.id === id) return a;
            }
            for (const t of (CFG.landing_tiles || [])) if (t.id === id) return t;
            for (const g of (CFG.landing_groups || [])) for (const t of (g.tiles || [])) if (t.id === id) return t;
            for (const s of (CFG.sections || [])) for (const b of (s.blocks || [])) if (b.type === 'webs') for (const w of (b.webs || [])) if (w.id === id) return w;
            for (const s of (CFG.sections || [])) for (const b of (s.blocks || [])) if (b.type === 'tiles') for (const t of (b.tiles || [])) if (t.id === id) return t;
            return null;
        }

        function showMaint() {
            const m = CFG.maintenance, f = CFG.footer || {};
            const tg = (m.show_telegram && f.telegram_url) ? `<a href="${esc(f.telegram_url)}" target="_blank" rel="noopener" class="ft-tg" style="margin-top:24px"><svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>${esc(f.telegram_text || 'Join Telegram')}</a>` : '';
            document.getElementById('app').innerHTML = `<div class="maint"><div style="max-width:420px"><div style="font-size:64px;margin-bottom:16px">${esc(m.icon || '🔧')}</div><h1 style="font-family:'Space Grotesk';font-size:28px;margin-bottom:12px">${esc(m.title)}</h1><p style="color:rgba(240,240,240,.45);font-size:14px;line-height:1.7">${esc(m.message)}</p>${tg}</div></div>`;
        }

        /* ═══ COLLECT ALL APPS & WEBS ═══ */
        function collectApps() {
            const apps = [];
            (CFG.sections || []).forEach(s => {
                (s.blocks || []).forEach(b => { if (b.type === 'apps') (b.apps || []).filter(on).sort(byOrder).forEach(a => apps.push(a)); });
                (s.apps || []).filter(on).sort(byOrder).forEach(a => apps.push(a));
            });
            return apps;
        }
        function collectWebs() {
            const webs = [];
            (CFG.sections || []).forEach(s => {
                (s.blocks || []).forEach(b => { if (b.type === 'webs') (b.webs || []).filter(on).sort(byOrder).forEach(w => webs.push(w)); });
                (s.web_links || []).filter(on).sort(byOrder).forEach(w => webs.push(w));
            });
            return webs;
        }

        /* ═══ LOGO HELPERS ═══ */
        function logoStyle(logo, legacyColors) {
            if (logo && logo.type === 'image' && logo.url) return '';
            const c = (logo && logo.colors) || legacyColors || ['#333', '#111'];
            return `background:linear-gradient(135deg,${esc(c[0])},${esc(c[1] || c[0])})`;
        }
        function logoInner(logo, legacyText) {
            if (logo && logo.type === 'image' && logo.url) return `<img src="${esc(logo.url)}" alt="">`;
            return esc((logo && logo.text) || legacyText || '');
        }
        function tileIcon(t) {
            if (t.icon_type === 'image' && t.icon_img) return `<img src="${esc(t.icon_img)}" alt="">`;
            return esc(t.icon || '');
        }
        function webIconHtml(w) {
            if (w.icon_type === 'image' && w.icon_img) return `<img src="${esc(w.icon_img)}" alt="">`;
            return esc(w.icon || '🌐');
        }
        function featIconHtml(ft) {
            if (ft.icon_type === 'image' && ft.icon_img) return `<img src="${esc(ft.icon_img)}" alt="">`;
            return esc(ft.icon || '');
        }

        /* ═══ RENDER ═══ */
        function render() {
            const h = CFG.hero || {}, f = CFG.footer || {};
            const apps = collectApps();
            const webs = collectWebs();
            const tiles = (CFG.landing_tiles || []).filter(on).sort(byOrder);
            const groups = (CFG.landing_groups || []).filter(on).sort(byOrder);
            const bl = h.brand_logo;
            const brandInner = (bl && bl.type === 'image' && bl.url) ? `<img src="${esc(bl.url)}" alt="">` : esc((bl && bl.text) || h.brand_logo_text || 'N');
            const brandStyle = (bl && bl.type === 'image' && bl.url) ? '' : `background:linear-gradient(135deg,${esc(h.brand_color || '#e8163a')},#b8102e)`;

            const langs = (h.languages || []).map(l => `<span class="lang-pill">${esc(l)}</span>`).join('');
            const feats = (h.features || []).map(ft => `<div class="feat-item"><div class="feat-ic" style="background:${esc(ft.bg || 'rgba(255,255,255,.08)')}">${featIconHtml(ft)}</div>${esc(ft.label)}</div>`).join('');

            /* hero feature cards from tiles+groups */
            const allCards = [...tiles, ...[].concat(...groups.map(g => (g.tiles || []).filter(on).sort(byOrder)))];
            const heroCards = allCards.slice(0, 5).map(t => `<div class="hero-card"><div class="hc-icon" style="background:rgba(${hexToRgb(t.color || '#e8163a')},.08)">${tileIcon(t)}</div><div><div class="hc-title">${esc(t.title)}</div><div class="hc-desc">${esc(t.subtitle)}</div></div></div>`).join('');

            /* app cards */
            const appCards = apps.map(a => {
                const bc = a.badge_colors || ['#e8163a', '#f43f5e'];
                const bt = a.btn_colors || ['#e8163a', '#b8102e'];
                const href = a.download_url && a.download_url.trim() ? esc(a.download_url) : '#';
                const feats = (a.features || []).slice(0, 4).map(ft => `<li><span class="ck" style="background:${esc(a.feature_check_bg || 'rgba(232,22,58,.1)')};color:${esc(a.feature_check_color || '#e8163a')}">✓</span>${esc(ft)}</li>`).join('');
                return `<div class="app-card reveal">
      ${a.badge_text ? `<div class="app-tag" style="background:linear-gradient(90deg,${esc(bc[0])},${esc(bc[1])});color:${esc(a.badge_text_color || '#fff')}">${esc(a.badge_text)}</div>` : ''}
      <div class="app-logo" style="${logoStyle(a.logo, a.logo_colors)}">${logoInner(a.logo, a.logo_text)}</div>
      <div class="app-name">${esc(a.name)}</div>
      <div class="app-ver">v${esc(a.version || '')} · ${esc(a.size_text || 'Android · Free')}</div>
      ${feats ? `<ul class="app-feats">${feats}</ul>` : ''}
      <a href="${href}" class="dl-btn" style="background:linear-gradient(135deg,${esc(bt[0])},${esc(bt[1] || bt[0])});color:${esc(a.btn_text_color || '#fff')}"${href === '#' ? ' onclick="return false"' : ''}>${esc(a.btn_text || 'Download APK')}</a>
    </div>`;
            }).join('');

            /* web cards */
            const webCards = webs.map(w => `<div class="web-card reveal">
    ${w.badge ? `<div class="web-tag">${esc(w.badge)}</div>` : ''}
    <div class="web-icon">${webIconHtml(w)}</div>
    <div class="web-info"><div class="web-title">${esc(w.name)}</div><div class="web-desc">${esc(w.description || '')}</div></div>
    <a href="${esc(w.url)}" class="web-go" target="_blank" rel="noopener">${esc(w.btn_text || 'Open ›')}</a>
  </div>`).join('');

            /* category tiles */
            const catCards = allCards.map(t => {
                const act = t.action_type === 'link' ? `href="${esc(t.action_target || '#')}" target="_blank" rel="noopener"` : `href="${esc(t.action_target || '#')}"`;
                return `<a ${act} class="cat-card reveal">
      ${t.badge_text ? `<span class="cat-badge" style="background:${esc(t.badge_color || t.color)}">${esc(t.badge_text)}</span>` : ''}
      <span class="cat-icon">${tileIcon(t)}</span>
      <div class="cat-title">${esc(t.title)}</div>
      <div class="cat-desc">${esc(t.subtitle)}</div>
    </a>`;
            }).join('');

            /* share */
            const siteUrl = 'https://netmovie.site';
            const shareText = encodeURIComponent('Best free streaming site! ' + siteUrl);

            /* footer links */
            const flinks = (f.links || []).filter(l => l.url).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');

            document.getElementById('app').innerHTML = `
  <!-- NAV -->
  <nav id="mainNav"><div class="nav-inner">
    <div class="nav-brand">
      <div class="nav-logo" style="${brandStyle}">${brandInner}</div>

        /* ═══ UTILITIES ═══ */
        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            const n = parseInt(hex, 16);
            return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
        }
        function copyLink() {
            navigator.clipboard.writeText(window.location.origin).then(() => showToast('Link copied!')).catch(() => showToast('Copy failed'));
        }
        function showToast(msg) {
            const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transition = '.3s'; setTimeout(() => t.remove(), 300) }, 2200);
        }

        /* ═══ SCROLL REVEAL ═══ */
        function initReveal() {
            const io = new IntersectionObserver(entries => {
                entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
            }, { threshold: .12, rootMargin: '0px 0px -40px 0px' });
            document.querySelectorAll('.reveal').forEach(el => io.observe(el));
        }

        /* ═══ NAV SCROLL ═══ */
        function initNav() {
            const nav = document.getElementById('mainNav');
            if (!nav) return;
            window.addEventListener('scroll', () => {
                if (window.pageYOffset > 50) nav.classList.add('scrolled'); else nav.classList.remove('scrolled');
            }, { passive: true });
        }

        /* ═══ PARTICLES ═══ */
        function initParticles() {
            const c = document.getElementById('particles');
            if (!c || window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div'); p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = Math.random() * 10 + 's';
                p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
                c.appendChild(p);
            }
        }

        boot();
    </script>
